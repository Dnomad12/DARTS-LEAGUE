<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Darts League — Standings</title>
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial;max-width:1000px;margin:2rem auto;padding:0 1rem;color:#222}
    header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
    h1{margin:0;font-size:1.25rem}
    table{width:100%;border-collapse:collapse;margin-top:1rem}
    th,td{padding:.5rem .6rem;border:1px solid #e6e6e6;text-align:left}
    thead th{background:#f7f7f7}
    .center{text-align:center}
    .small{font-size:.9rem;color:#555}
    footer{margin-top:2rem;font-size:.85rem;color:#666}
    @media (max-width:640px){table th:nth-child(n+6),table td:nth-child(n+6){display:none}}
  </style>
</head>
<body>
  <header>
    <h1>Darts League — Standings</h1>
    <div class="small">Season: <span id="season">2026</span></div>
  </header>

  <main>
    <section id="standings-section">
      <table id="standings">
        <thead>
          <tr>
            <th>#</th>
            <th>Player</th>
            <th class="center">MP</th>
            <th class="center">W</th>
            <th class="center">L</th>
            <th class="center">Legs+</th>
            <th class="center">Legs-</th>
            <th class="center">Diff</th>
            <th class="center">Pts</th>
          </tr>
        </thead>
        <tbody>
          <!-- rows inserted by JS -->
        </tbody>
      </table>
    </section>
  </main>

  <footer>
    <div class="small">Standings updated from data/standings.json</div>
  </footer>

  <script type="module" src="./assets/js/standings.js"></script>
</body>
</html>
